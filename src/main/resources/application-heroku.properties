# =========================================
# CONFIGURACION PARA HEROKU (PostgreSQL)
# =========================================
# Este archivo usa Config Vars de Heroku para mayor seguridad
# Las credenciales NO deben estar hardcodeadas en el código

# PostgreSQL - Usando DATABASE_URL de Heroku
spring.datasource.url=${DATABASE_URL}

# Driver y Dialect PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# IMPORTANTE: create-drop crea tablas al iniciar y las elimina al cerrar
# Para producción permanente usar: update
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Configuración adicional para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Inicialización de esquema (solo si es necesario)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# MongoDB Atlas - Usando Config Vars de Heroku
spring.data.mongodb.uri=${MONGODB_URI}

# Server - Heroku asigna puerto dinámico
server.port=${PORT:8080}

# Seguridad - Cache habilitado en producción
spring.thymeleaf.cache=true