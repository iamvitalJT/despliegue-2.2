<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🏢 Gestión Empresarial</a>
            <div class="d-flex align-items-center">
                <a class="nav-link text-white me-3" href="/empleados">👥 Empleados</a>
                <span class="text-white-50 me-3">|</span>
                <a class="nav-link text-white me-3" href="/proyectos">📋 Proyectos</a>
                <span class="text-white-50 me-3">|</span>
                <a class="nav-link text-white" href="/logout">🚪 Salir</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0" th:text="${titulo}">Formulario Empleado</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/empleados/guardar}" method="post" th:object="${empleado}">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" th:field="*{nombre}" 
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" 
                                     th:errors="*{nombre}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Cargo</label>
                                <input type="text" class="form-control" th:field="*{cargo}"
                                       th:classappend="${#fields.hasErrors('cargo')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('cargo')}" 
                                     th:errors="*{cargo}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Salario</label>
                                <input type="number" class="form-control" th:field="*{salario}" step="0.01"
                                       th:classappend="${#fields.hasErrors('salario')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('salario')}" 
                                     th:errors="*{salario}"></div>
                            </div>                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" 
                                     th:errors="*{email}"></div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="/empleados" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        const form = document.querySelector('form');
        const empleadoId = /*[[${empleado.id}]]*/ null;
        
        form.addEventListener('submit', function(e) {
            if (empleadoId) {  // Solo para actualizar
                e.preventDefault();
                Swal.fire({
                    title: '¿Actualizar Empleado?',
                    text: "¿Confirmas los cambios?",
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'Sí, actualizar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        Swal.fire({
                            title: 'Actualizando...',
                            allowOutsideClick: false,
                            didOpen: () => Swal.showLoading()
                        });
                        form.submit();
                    }
                });
            }
        });
    </script>
</body>
</html>
