<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${proyecto.nombre}">Detalle del Proyecto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🏢 Gestión Empresarial</a>
            <div class="d-flex align-items-center">
                <a class="nav-link text-white me-3" href="/empleados">👥 Empleados</a>
                <span class="text-white-50 me-3">|</span>
                <a class="nav-link text-white me-3" href="/proyectos">📋 Proyectos</a>
                <span class="text-white-50 me-3">|</span>
                <a class="nav-link text-white" href="/logout">🚪 Salir</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Mensajes -->
        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${exito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Información del Proyecto -->
        <div class="card mb-3">
            <div class="card-header bg-dark text-white">
                <div class="d-flex justify-content-between align-items-center">
                    <h4 class="mb-0" th:text="${proyecto.nombre}">Nombre del Proyecto</h4>
                    <div>
                        <a th:href="@{/proyectos/editar/{id}(id=${proyecto.id})}" class="btn btn-sm btn-light">Editar</a>
                        <a th:href="@{/proyectos/eliminar/{id}(id=${proyecto.id})}" class="btn btn-sm btn-outline-light"
                           onclick="return confirm('¿Eliminar proyecto?')">Eliminar</a>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <p th:text="${proyecto.descripcion}">Descripción</p>
                
                <div class="row">
                    <div class="col-md-6" th:if="${empleado}">
                        <h6>Empleado Asignado:</h6>
                        <p><strong th:text="${empleado.nombre}"></strong> - <span th:text="${empleado.cargo}"></span></p>
                        <p><small th:text="${empleado.email}"></small></p>
                    </div>
                    <div class="col-md-6">
                        <h6>Estadísticas:</h6>
                        <p>Total de tareas: <strong th:text="${proyecto.tareas != null ? proyecto.tareas.size() : 0}">0</strong></p>
                    </div>
                </div>
            </div>        </div>

        <!-- Tareas -->
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Tareas (<span th:text="${proyecto.tareas != null ? proyecto.tareas.size() : 0}">0</span>)</h5>
            </div>
            <div class="card-body">
                <!-- Agregar tarea -->
                <form th:action="@{/proyectos/{id}/tareas(id=${proyecto.id})}" method="post" class="mb-4">
                    <div class="row g-2">
                        <div class="col-md-6">
                            <input type="text" class="form-control" name="titulo" placeholder="Título de la tarea" required>
                        </div>
                        <div class="col-md-4">
                            <select class="form-select" name="estado" required>
                                <option value="">Estado</option>
                                <option value="pendiente">Pendiente</option>
                                <option value="en_progreso">En Progreso</option>
                                <option value="completo">Completo</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">Agregar</button>
                        </div>
                    </div>
                </form>

                <!-- Lista de tareas -->
                <div th:if="${proyecto.tareas == null or proyecto.tareas.empty}" class="text-center py-4 text-muted">
                    No hay tareas asignadas
                </div>

                <div th:unless="${proyecto.tareas == null or proyecto.tareas.empty}" class="row">
                    <div th:each="tarea, iterStat : ${proyecto.tareas}" class="col-md-4 mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h6 th:text="${tarea.titulo}">Tarea</h6>
                                <span class="badge bg-secondary" th:text="${tarea.estado}">Estado</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Botones -->
        <div class="text-center mt-4 mb-4">
            <a href="/proyectos" class="btn btn-secondary">Volver</a>
            <a th:href="@{/proyectos/editar/{id}(id=${proyecto.id})}" class="btn btn-primary">Editar Proyecto</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
