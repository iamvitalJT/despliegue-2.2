<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🏢 Gestión Empresarial</a>
            <div class="d-flex align-items-center">
                <a class="nav-link text-white me-3" href="/empleados">👥 Empleados</a>
                <span class="text-white-50 me-3">|</span>
                <a class="nav-link text-white me-3" href="/proyectos">📋 Proyectos</a>
                <span class="text-white-50 me-3">|</span>
                <a class="nav-link text-white" href="/logout">🚪 Salir</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Mensajes -->
        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${exito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Proyectos</h2>
            <div>
                <a href="/proyectos/nuevo" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Nuevo Proyecto
                </a>
                <div class="btn-group ms-2">
                    <button class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="fas fa-download"></i> Exportar
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/export/proyectos/excel(buscar=${termino})}">Excel</a></li>
                        <li><a class="dropdown-item" th:href="@{/export/proyectos/pdf(buscar=${termino})}">PDF</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Búsqueda -->
        <form method="get" action="/proyectos" class="mb-3">
            <div class="input-group">
                <input type="text" class="form-control" name="buscar" th:value="${termino}" 
                       placeholder="Buscar proyecto...">
                <button type="submit" class="btn btn-primary">Buscar</button>
                <a href="/proyectos" class="btn btn-outline-secondary">Limpiar</a>
            </div>
        </form>

        <!-- Lista de Proyectos -->
        <div th:if="${proyectos.empty}" class="text-center py-5">
            <p class="text-muted">No hay proyectos</p>
            <a href="/proyectos/nuevo" class="btn btn-primary">Crear Primer Proyecto</a>
        </div>

        <div th:unless="${proyectos.empty}" class="row">
            <div class="col-md-6 col-lg-4 mb-3" th:each="proyecto : ${proyectos}">
                <div class="card h-100">
                    <div class="card-header">
                        <h5 class="mb-0" th:text="${proyecto.nombre}"></h5>
                    </div>
                    <div class="card-body">
                        <p class="text-muted small" th:text="${proyecto.descripcion}"></p>
                          <div class="mb-2" th:each="emp : ${empleados}" th:if="${emp.id == proyecto.empleadoId}">
                            <small><strong>Responsable:</strong> <span th:text="${emp.nombre}"></span></small>
                        </div>
                          <div class="mb-2">
                            <span class="badge bg-secondary" th:if="${proyecto.tareas != null and !proyecto.tareas.empty}">
                                <i class="fas fa-tasks"></i> <span th:text="${proyecto.tareas.size()}"></span>
                            </span>
                        </div>

                        <div th:if="${proyecto.tareas != null and !proyecto.tareas.empty}" class="mt-2">
                            <small class="text-muted">Tareas:</small>
                            <div class="list-group list-group-flush">
                                <div class="list-group-item p-1 small" th:each="tarea : ${proyecto.tareas}">
                                    <i class="fas fa-check text-success" th:if="${tarea.estado == 'completo'}"></i>
                                    <i class="fas fa-spinner text-primary" th:if="${tarea.estado == 'en_progreso'}"></i>
                                    <i class="fas fa-circle text-secondary" th:if="${tarea.estado == 'pendiente'}"></i>
                                    <span th:text="${tarea.titulo}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="btn-group w-100">
                            <a th:href="@{/proyectos/detalle/{id}(id=${proyecto.id})}" class="btn btn-sm btn-info">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a th:href="@{/proyectos/editar/{id}(id=${proyecto.id})}" class="btn btn-sm btn-warning">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:href="@{/proyectos/eliminar/{id}(id=${proyecto.id})}" class="btn btn-sm btn-danger"
                               onclick="return confirm('¿Eliminar proyecto?')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
