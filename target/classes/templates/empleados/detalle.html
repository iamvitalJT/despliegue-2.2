<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🏢 Gestión Empresarial</a>
            <div class="d-flex align-items-center">
                <a class="nav-link text-white me-3" href="/empleados">👥 Empleados</a>
                <span class="text-white-50 me-3">|</span>
                <a class="nav-link text-white me-3" href="/proyectos">📋 Proyectos</a>
                <span class="text-white-50 me-3">|</span>
                <a class="nav-link text-white" href="/logout">🚪 Salir</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4">
                <div class="card mb-3">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Información</h5>
                    </div>
                    <div class="card-body">
                        <h4 th:text="${empleado.nombre}"></h4>
                        <p class="text-muted mb-2" th:text="${empleado.cargo}"></p>
                        <p class="mb-2"><strong>Salario:</strong> 
                            <span th:text="'$' + ${#numbers.formatDecimal(empleado.salario, 0, 'COMMA', 0, 'POINT')}"></span>
                        </p>                        <p class="mb-2"><strong>Email:</strong> 
                            <a th:href="'mailto:' + ${empleado.email}" th:text="${empleado.email}"></a>
                        </p>
                        <p class="mb-0">
                            <strong>ID:</strong> <span class="badge bg-secondary" th:text="${empleado.id}"></span>
                        </p>
                    </div>
                    <div class="card-footer">
                        <div class="d-grid gap-2">
                            <a th:href="@{/empleados/editar/{id}(id=${empleado.id})}" class="btn btn-warning">
                                <i class="fas fa-edit"></i> Editar
                            </a>
                            <a th:href="@{/empleados/eliminar/{id}(id=${empleado.id})}" class="btn btn-danger"
                               onclick="return confirm('¿Eliminar empleado?')">
                                <i class="fas fa-trash"></i> Eliminar
                            </a>
                            <a href="/empleados" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Volver
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Proyectos Asignados</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${proyectos.empty}" class="text-center py-4">
                            <p class="text-muted">Sin proyectos asignados</p>
                        </div>
                        
                        <div th:unless="${proyectos.empty}" class="row">
                            <div class="col-md-6 mb-3" th:each="proyecto : ${proyectos}">
                                <div class="card h-100">                                    <div class="card-body">
                                        <h6 th:text="${proyecto.nombre}"></h6>
                                        <p class="text-muted small mb-2" th:text="${proyecto.descripcion}"></p>
                                        <span class="badge bg-secondary" th:if="${proyecto.tareas != null}">
                                            <i class="fas fa-tasks"></i> <span th:text="${proyecto.tareas.size()}"></span> tareas
                                        </span>
                                    </div>
                                    <div class="card-footer">
                                        <a th:href="@{/proyectos/detalle/{id}(id=${proyecto.id})}" class="btn btn-sm btn-outline-primary">
                                            Ver Detalle
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
