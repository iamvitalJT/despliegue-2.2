<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🏢 Gestión Empresarial</a>
            <div class="d-flex align-items-center">
                <a class="nav-link text-white me-3" href="/empleados">👥 Empleados</a>
                <span class="text-white-50 me-3">|</span>
                <a class="nav-link text-white me-3" href="/proyectos">📋 Proyectos</a>
                <span class="text-white-50 me-3">|</span>
                <a class="nav-link text-white" href="/logout">🚪 Salir</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Mensajes -->
        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${exito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Empleados</h2>
            <div>
                <a href="/empleados/nuevo" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Nuevo
                </a>
                <div class="btn-group ms-2">
                    <button class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="fas fa-download"></i> Exportar
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/export/empleados/excel(termino=${termino})}">Excel</a></li>
                        <li><a class="dropdown-item" th:href="@{/export/empleados/pdf(termino=${termino})}">PDF</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Búsqueda -->
        <form method="get" action="/empleados" class="mb-3">
            <div class="input-group">
                <input type="text" class="form-control" name="buscar" th:value="${termino}" 
                       placeholder="Buscar empleado...">
                <button type="submit" class="btn btn-primary">Buscar</button>
                <a href="/empleados" class="btn btn-outline-secondary">Limpiar</a>
            </div>
        </form>

        <!-- Tabla -->
        <div class="card">
            <div class="card-body">
                <div th:if="${empleados.empty}" class="text-center py-5">
                    <p class="text-muted">No hay empleados</p>
                    <a href="/empleados/nuevo" class="btn btn-primary">Agregar Empleado</a>
                </div>
                
                <table th:unless="${empleados.empty}" class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Cargo</th>
                            <th>Salario</th>
                            <th>Email</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="emp : ${empleados}">
                            <td th:text="${emp.id}"></td>
                            <td th:text="${emp.nombre}"></td>
                            <td th:text="${emp.cargo}"></td>
                            <td th:text="'$' + ${#numbers.formatDecimal(emp.salario, 0, 'COMMA', 0, 'POINT')}"></td>
                            <td th:text="${emp.email}"></td>
                            <td>
                                <a th:href="@{/empleados/detalle/{id}(id=${emp.id})}" class="btn btn-sm btn-info">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a th:href="@{/empleados/editar/{id}(id=${emp.id})}" class="btn btn-sm btn-warning">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{/empleados/eliminar/{id}(id=${emp.id})}" class="btn btn-sm btn-danger"
                                   onclick="return confirm('¿Eliminar empleado?')">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
