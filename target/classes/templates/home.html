<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🏢 Gestión Empresarial</a>
            <div class="d-flex align-items-center">
                <a class="nav-link text-white me-3" href="/empleados">👥 Empleados</a>
                <span class="text-white-50 me-3">|</span>
                <a class="nav-link text-white me-3" href="/proyectos">📋 Proyectos</a>
                <span class="text-white-50 me-3">|</span>
                <a class="nav-link text-white" href="/logout">🚪 Salir</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="text-center mb-5">
                    <i class="fas fa-cogs fa-4x text-dark mb-3"></i>
                    <h1>Sistema de Gestión Empresarial</h1>
                    <p class="text-muted">Selecciona un módulo para comenzar</p>
                </div>

                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="card text-center h-100">
                            <div class="card-body py-5">
                                <i class="fas fa-users fa-4x text-primary mb-3"></i>
                                <h3>Empleados</h3>
                                <p class="text-muted">Gestión de recursos humanos</p>
                                <a href="/empleados" class="btn btn-primary">Acceder</a>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="card text-center h-100">
                            <div class="card-body py-5">
                                <i class="fas fa-tasks fa-4x text-success mb-3"></i>
                                <h3>Proyectos</h3>
                                <p class="text-muted">Gestión de proyectos y tareas</p>
                                <a href="/proyectos" class="btn btn-success">Acceder</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
