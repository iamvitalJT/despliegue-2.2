<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario Proyecto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🏢 Gestión Empresarial</a>
            <div class="d-flex align-items-center">
                <a class="nav-link text-white me-3" href="/empleados">👥 Empleados</a>
                <span class="text-white-50 me-3">|</span>
                <a class="nav-link text-white me-3" href="/proyectos">📋 Proyectos</a>
                <span class="text-white-50 me-3">|</span>
                <a class="nav-link text-white" href="/logout">🚪 Salir</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0" th:text="${titulo}">Formulario Proyecto</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/proyectos/guardar}" method="post" th:object="${proyecto}">
                            <input type="hidden" th:field="*{id}">
                            
                            <!-- Nombre del Proyecto -->
                            <div class="mb-3">
                                <label class="form-label">
                                    <i class="fas fa-project-diagram"></i> Nombre del Proyecto
                                </label>
                                <input type="text" class="form-control" th:field="*{nombre}" 
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''" 
                                       placeholder="Ej: Sistema de Gestión Empresarial" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" 
                                     th:errors="*{nombre}"></div>
                            </div>

                            <!-- Descripción -->
                            <div class="mb-3">
                                <label class="form-label">
                                    <i class="fas fa-align-left"></i> Descripción
                                </label>
                                <textarea class="form-control" th:field="*{descripcion}" rows="4"
                                          th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid' : ''" 
                                          placeholder="Describe el proyecto en detalle..." required></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" 
                                     th:errors="*{descripcion}"></div>
                            </div>

                            <!-- Empleado Responsable -->
                            <div class="mb-3">
                                <label class="form-label">
                                    <i class="fas fa-user-tie"></i> Empleado Responsable
                                </label>
                                <select class="form-select" th:field="*{empleadoId}"
                                        th:classappend="${#fields.hasErrors('empleadoId')} ? 'is-invalid' : ''" required>
                                    <option value="">Selecciona un empleado...</option>
                                    <option th:each="empleado : ${empleados}" 
                                            th:value="${empleado.id}" 
                                            th:text="${empleado.nombre + ' - ' + empleado.cargo}">
                                    </option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('empleadoId')}" 
                                     th:errors="*{empleadoId}"></div>
                                <small class="text-muted">
                                    <i class="fas fa-info-circle"></i> Selecciona el empleado encargado del proyecto
                                </small>
                            </div>

                            <!-- Botones de acción -->
                            <div class="d-flex justify-content-between mt-4">
                                <a href="/proyectos" class="btn btn-secondary">
                                    <i class="fas fa-times"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Guardar Proyecto
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Información adicional -->
                <div class="card mt-3" th:if="${proyecto.id != null}">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-info-circle"></i> Información Adicional
                        </h5>
                    </div>
                    <div class="card-body">
                        <p class="mb-2">
                            <strong>ID del Proyecto:</strong> 
                            <span class="badge bg-secondary" th:text="${proyecto.id}">N/A</span>
                        </p>
                        <p class="mb-0">
                            <i class="fas fa-tasks"></i> Después de guardar, podrás agregar tareas al proyecto desde la vista de detalle.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
